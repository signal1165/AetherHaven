id: org.aetherhaven.AetherHaven
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: aetherhaven_launcher
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

modules:
  - name: xrandr
    buildsystem: meson
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/app/xrandr-1.5.4.tar.xz
        sha256: 2cafccb2aaf2491a4068676117a0d4f90ab307724b96fffc54cd1da953779400
    cleanup:
      - /share/man

  - name: aetherhaven
    buildsystem: simple
    only-arches:
      - x86_64
    sources:
      - type: file
        url: https://github.com/signal1165/AetherHaven/releases/download/aetherhaven-2.8.0/AetherHaven_2.8.0_linux_x86_64.deb
        sha256: 8ac0ea645b78bcd2a9e13cb14e4ab22cc732ddf33b7bea88375cfcba4114d536
        dest-filename: aetherhaven.deb
      - type: file
        path: org.aetherhaven.AetherHaven.metainfo.xml
    build-commands:
      - ar x aetherhaven.deb
      - tar xf data.tar.*
      - install -Dm755 usr/bin/aetherhaven_launcher -t /app/bin
      - |
        for dir in usr/share/icons/hicolor/*/; do
          size=$(basename "$dir" | cut -d@ -f1)
          install -Dm644 "$dir/apps/aetherhaven_launcher.png" "/app/share/icons/hicolor/$size/apps/$FLATPAK_ID.png"
        done
      - sed -e "s|^Exec=.*|Exec=aetherhaven_launcher %u|" -e "s|^Icon=.*|Icon=$FLATPAK_ID|" usr/share/applications/aetherhaven_launcher.desktop > $FLATPAK_ID.desktop
      - echo "MimeType=x-scheme-handler/aetherhaven;" >> $FLATPAK_ID.desktop
      - install -Dm644 $FLATPAK_ID.desktop -t /app/share/applications
      - install -Dm644 $FLATPAK_ID.metainfo.xml -t /app/share/metainfo
